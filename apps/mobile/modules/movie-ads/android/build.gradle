apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.movieads'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.movieads"
  compileSdk safeExtGet('compileSdkVersion', 34)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 23)
    targetSdk safeExtGet('targetSdkVersion', 34)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.9.0')}"
  implementation 'com.facebook.react:react-android'
  // Start.io in-app ads (mavenCentral). Pinned, not 5.+, so an SDK major
  // never lands inside an OTA binary silently.
  implementation 'com.startapp:inapp-sdk:5.3.1'
}
