# FilmSnaps Desktop — Electron Builder Configuration
#
# Single source of truth for electron-builder. IMPORTANT: electron-builder
# only reads this file when package.json has NO "build" field — if a "build"
# field exists in package.json it is used instead and this file is silently
# ignored (see node_modules/app-builder-lib/out/util/config/load.js). Keep the
# config in ONE place: either here or in the package.json "build" field, never
# both.

appId: com.filmsnaps.desktop
productName: FilmSnaps
copyright: Copyright © 2026 FilmSnaps
electronVersion: 42.4.1

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*

icon: resources/icon.png

# In production, bundle the web app's Next.js standalone output so Electron
# can serve the app locally. Built by scripts/build-web.mjs (which sets
# BUILD_FOR_DESKTOP=true so next.config.js emits .next/standalone). The
# standalone output includes the server + all necessary node_modules + static
# files. `from` paths are relative to THIS file's directory (apps/desktop).
extraResources:
  - from: ../../packages/filter-compiler/build/compiled-engine.bin
    to: filter-engine/compiled-engine.bin
  - from: ../../packages/filter-compiler/build/android-adblock-patterns.json
    to: filter-engine/android-adblock-patterns.json
  # v5 split config (OTA-signed). providers.json.sig + the public key let the
  # app verify any OTA update before applying. filters.txt feeds the engine.
  - from: ../../providers.json
    to: providers.json
  - from: ../../providers.json.sig
    to: providers.json.sig
  - from: ../../filters.txt
    to: filters.txt
  - from: ../../.keys/filmsnaps-ed25519.pub
    to: filter-engine/filmsnaps-ed25519.pub
  # Legacy v4 (mobile-facing; desktop reads v5 first, falls back to this).
  - from: ../../blocklist.json
    to: blocklist.json
  - from: ../web/.next/standalone
    to: web
  - from: ../web/public
    to: web/apps/web/public
  - from: ../web/.next/static
    to: web/apps/web/.next/static

# GitHub Releases — used for distribution and auto-updates
publish:
  provider: github
  owner: anonymous260260a-arch
  repo: filmsnaps
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "FilmSnaps-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  unicode: true
  perMachine: false
  artifactName: "FilmSnaps-Setup-${version}.${ext}"
  guid: "3A7B9D1F-5C8E-4F2A-B1D6-9E0F3A7C8B2D"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.entertainment
  darkModeSupport: true
  artifactName: "FilmSnaps-${version}-${arch}.${ext}"

dmg:
  title: FilmSnaps

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: AudioVideo
  synopsis: Cross-platform streaming desktop app
  description: Browse, search, and watch movies and TV shows securely.
  artifactName: "FilmSnaps-${version}.${ext}"
