apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace "expo.modules.subtitlesync"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }

  lint {
    // Media3 surface we use (OkHttpDataSource, TeeAudioProcessor, renderers) is
    // annotated @UnstableApi — same trade the expo-video player already makes.
    disable 'UnsafeOptInUsageError'
  }
}

dependencies {
  implementation project(":expo-modules-core")
  implementation project(":expo-video")
  // Pin to expo-video's exact media3 version (expo-video/android/build.gradle)
  def media3Version = "1.8.0"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-datasource:${media3Version}"
  implementation "androidx.media3:media3-datasource-okhttp:${media3Version}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
